services:
  - type: web
    name: gold-lstm
    env: python
    region: singapore
    rootDir: FINAL7/Deploy
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1 --threads 1 --preload"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRED_API_KEY
        sync: false
